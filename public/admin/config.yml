# DecapBridge backend.
# Create the site in the DecapBridge dashboard, then paste the generated
# "backend:" block here (it supplies repo, base_url, auth_endpoint, etc.).
# The values below are PLACEHOLDERS and will not work until replaced.
backend:
  name: git-gateway
  repo: YOUR_GITHUB_USER/jackandkie-site
  branch: main
  base_url: https://REPLACE_WITH_VALUE_FROM_DECAPBRIDGE
  auth_endpoint: REPLACE_WITH_VALUE_FROM_DECAPBRIDGE

media_folder: public/images/uploads
public_folder: /images/uploads

# Only takes effect on localhost: skips login and edits files on disk.
# Needs `npx decap-server` running (use `npm run dev:cms`).
local_backend: true

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home page
        file: src/content/home.json
        fields:
          - { name: title, label: Page title, widget: string }
          - { name: description, label: Meta description, widget: text }
          - { name: logo, label: Logo (header and footer), widget: image }
          - { name: logo_alt, label: Logo alt text, widget: string }
          - name: nav
            label: Header navigation
            widget: object
            fields:
              - { name: contact_label, label: Contact link label, widget: string }
              - { name: contact_link, label: Contact link target, widget: string }
          - name: slider
            label: Slider settings
            widget: object
            fields:
              - { name: autoplay_seconds, label: Time each slide is shown (seconds, 0 = no auto-scroll), hint: "Higher = slower. Example: 3 is fast, 8 is slow.", widget: number, value_type: float, min: 0, step: 0.5 }
              - { name: transition_seconds, label: Slide animation speed (seconds), hint: "How long the slide-across animation takes. 0 = instant, 0.8 = default, 2 = slow glide.", widget: number, value_type: float, min: 0, max: 5, step: 0.1 }
          - name: hero
            label: Hero slider images
            widget: list
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Alt text, widget: string, required: false }
          - name: hello
            label: Hello section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: image, label: Image, widget: image }
              - { name: image_alt, label: Image alt text, widget: string, required: false }
          - name: welcome
            label: Welcome section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: image, label: Image, widget: image }
              - { name: image_alt, label: Image alt text, widget: string, required: false }
              - { name: button_label, label: Button label, widget: string }
              - { name: button_link, label: Button link, widget: string }
          - name: work
            label: Work section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: image, label: Image, widget: image }
              - { name: image_alt, label: Image alt text, widget: string, required: false }
              - { name: button_label, label: Button label, widget: string }
              - { name: button_link, label: Button link, widget: string }
          - name: words
            label: Words (testimonial)
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: quote, label: Quote, widget: text }
              - { name: author, label: Author, widget: string }
              - { name: image, label: Image, widget: image }
              - { name: image_alt, label: Image alt text, widget: string, required: false }
          - name: info
            label: Info / contact section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: image, label: Image, widget: image }
              - { name: image_alt, label: Image alt text, widget: string, required: false }
          - name: form
            label: Contact form
            widget: object
            fields:
              - { name: action, label: Form endpoint URL (form.taxi), widget: string }
              - { name: name_label, label: Name field label, widget: string }
              - { name: email_label, label: Email field label, widget: string }
              - { name: subject_label, label: Subject field label, widget: string }
              - { name: message_label, label: Message field label, widget: string }
              - { name: submit_label, label: Submit button label, widget: string }
              - { name: sending_label, label: Button label while sending, widget: string }
              - { name: success_heading, label: Thank-you heading, widget: string }
              - { name: success_text, label: Thank-you message, widget: text }
              - { name: error_text, label: Error message, widget: text }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: quick_links_heading, label: Quick links heading, widget: string }
              - name: quick_links
                label: Quick links
                widget: list
                required: false
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: url, label: URL, widget: string }
              - { name: follow_heading, label: Follow heading, widget: string }
              - { name: contact_heading, label: Get in touch heading, widget: string }
              - { name: email, label: Email, widget: string }
              - { name: email_label, label: Email link label, widget: string }
              - { name: whatsapp, label: WhatsApp number, widget: string }
              - { name: whatsapp_label, label: WhatsApp link label, widget: string }
              - { name: copyright, label: Copyright text (after the year), widget: string }
              - name: socials
                label: Social links
                widget: list
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: icon, label: Icon, widget: select, options: [facebook, instagram, pinterest, x-twitter, youtube, tiktok, linkedin] }
                  - { name: url, label: URL, widget: string }
