# DecapBridge (PKCE auth). Generated in the DecapBridge dashboard.
# No secrets here: the GitHub token is stored in DecapBridge, not in this repo.
backend:
  name: git-gateway
  repo: stephangriesel/jackandkie-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/74fd1227-d6ab-4205-918a-63e674f94571/pkce
  auth_token_endpoint: /sites/74fd1227-d6ab-4205-918a-63e674f94571/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Logo shown on the CMS login screen (the site logo)
logo_url: /images/uploads/logo-transparent.png

# Add site links in Decap CMS (change to the real domain when it goes live)
site_url: https://jackandkie.pages.dev


media_folder: public/images/uploads
public_folder: /images/uploads

# Only takes effect on localhost: skips login and edits files on disk.
# Needs `npx decap-server` running (use `npm run dev:cms`).
local_backend: true

collections:
  - name: home
    label: "Home page"
    description: "The sections of the home page, from top to bottom."
    files:
      - name: slider
        label: "Slider photos"
        file: src/content/home/slider.json
        description: "The big photo carousel at the top. Speed is under Settings."
        fields:
          - name: images
            label: "Photos"
            widget: list
            hint: "Drag to reorder."
            fields:
              - { name: image, label: "Photo", widget: image }
              - { name: alt, label: "Photo description (alt text)", widget: string, required: false }
      - name: hello
        label: "1 · Hello"
        file: src/content/home/hello.json
        description: "The first section after the slider."
        fields:
          - { name: heading, label: "Heading", widget: string }
          - { name: text, label: "Text", widget: text }
          - { name: image, label: "Photo", widget: image }
          - { name: image_alt, label: "Photo description (alt text)", widget: string, hint: "Describes the photo for screen readers and search engines.", required: false }
      - name: welcome
        label: "2 · Welcome"
        file: src/content/home/welcome.json
        description: "Introduction with a button."
        fields:
          - { name: heading, label: "Heading", widget: string }
          - { name: text, label: "Text", widget: text }
          - { name: button_label, label: "Button text", widget: string }
          - { name: button_link, label: "Button link", widget: string, hint: "A page address, or a #section on this page." }
          - { name: image, label: "Photo", widget: image }
          - { name: image_alt, label: "Photo description (alt text)", widget: string, hint: "Describes the photo for screen readers and search engines.", required: false }
      - name: work
        label: "3 · Work"
        file: src/content/home/work.json
        description: "Portfolio teaser with a button."
        fields:
          - { name: heading, label: "Heading", widget: string }
          - { name: text, label: "Text", widget: text }
          - { name: button_label, label: "Button text", widget: string }
          - { name: button_link, label: "Button link", widget: string, hint: "A page address, or a #section on this page." }
          - { name: image, label: "Photo", widget: image }
          - { name: image_alt, label: "Photo description (alt text)", widget: string, hint: "Describes the photo for screen readers and search engines.", required: false }
      - name: words
        label: "4 · Words (testimonial)"
        file: src/content/home/words.json
        description: "Client quote."
        fields:
          - { name: heading, label: "Heading", widget: string }
          - { name: quote, label: "Quote", widget: text, hint: "Without the quotation marks." }
          - { name: author, label: "Who said it", widget: string }
          - { name: image, label: "Photo", widget: image }
          - { name: image_alt, label: "Photo description (alt text)", widget: string, hint: "Describes the photo for screen readers and search engines.", required: false }
      - name: info
        label: "5 · Info"
        file: src/content/home/info.json
        description: "Text above the contact form."
        fields:
          - { name: heading, label: "Heading", widget: string }
          - { name: text, label: "Text", widget: text }
          - { name: image, label: "Photo", widget: image }
          - { name: image_alt, label: "Photo description (alt text)", widget: string, hint: "Describes the photo for screen readers and search engines.", required: false }
  - name: footer
    label: "Footer & contact form"
    description: "Footer details and the contact form wording."
    files:
      - name: footer
        label: "Footer"
        file: src/content/footer/footer.json
        description: "Contact details, social links and footer wording."
        fields:
          - { name: email, label: "Email address", widget: string }
          - { name: email_label, label: "Email link text", widget: string }
          - { name: whatsapp, label: "WhatsApp number", widget: string, hint: "Include the country code, for example +264..." }
          - { name: whatsapp_label, label: "WhatsApp link text", widget: string }
          - { name: contact_heading, label: "Contact column heading", widget: string }
          - { name: follow_heading, label: "Social column heading", widget: string }
          - name: socials
            label: "Social links"
            widget: list
            fields:
              - { name: label, label: "Name", widget: string }
              - { name: icon, label: "Icon", widget: select, options: [facebook, instagram, pinterest, x-twitter, youtube, tiktok, linkedin] }
              - { name: url, label: "Link", widget: string }
          - { name: quick_links_heading, label: "Quick links column heading", widget: string }
          - name: quick_links
            label: "Quick links"
            widget: list
            required: false
            fields:
              - { name: label, label: "Link text", widget: string }
              - { name: url, label: "Link", widget: string }
          - { name: copyright, label: "Copyright text", widget: string, hint: "Shown after the year, for example: All rights reserved." }
      - name: form-text
        label: "Contact form wording"
        file: src/content/footer/form-text.json
        description: "Field labels and the thank-you and error messages."
        fields:
          - { name: name_label, label: "Name field label", widget: string }
          - { name: email_label, label: "Email field label", widget: string }
          - { name: subject_label, label: "Subject field label", widget: string }
          - { name: message_label, label: "Message field label", widget: string }
          - { name: submit_label, label: "Send button text", widget: string }
          - { name: sending_label, label: "Button text while sending", widget: string }
          - { name: success_heading, label: "Thank-you heading", widget: string }
          - { name: success_text, label: "Thank-you message", widget: text }
          - { name: error_text, label: "Error message", widget: text }
  - name: settings
    label: "Settings"
    description: "Technical settings: title, logo, slider speed and form delivery."
    files:
      - name: site
        label: "Site (title, logo, menu)"
        file: src/content/settings/site.json
        description: "Browser title, search description, logo and the header link."
        fields:
          - { name: title, label: "Browser tab / Google title", widget: string, hint: "Shown in the browser tab and as the title in search results." }
          - { name: description, label: "Search description", widget: text, hint: "One or two sentences shown under the title in search results." }
          - { name: logo, label: "Logo", widget: image, hint: "Used in the header and footer." }
          - { name: logo_alt, label: "Logo description (alt text)", widget: string }
          - name: nav
            label: "Header menu link"
            widget: object
            fields:
              - { name: contact_label, label: "Link text", widget: string }
              - { name: contact_link, label: "Link goes to", widget: string, hint: "For example #contact to scroll to the form." }
      - name: slider-speed
        label: "Slider speed"
        file: src/content/settings/slider.json
        description: "How fast the top carousel moves."
        fields:
          - { name: autoplay_seconds, label: "Time each photo is shown (seconds)", widget: number, hint: "Higher is slower. 3 is fast, 8 is slow. 0 stops auto-scrolling.", value_type: float, min: 0, step: 0.5 }
          - { name: transition_seconds, label: "Slide animation speed (seconds)", widget: number, hint: "0 = instant, 0.8 = default, 2 = slow glide.", value_type: float, min: 0, max: 5, step: 0.1 }
      - name: form-delivery
        label: "Contact form delivery"
        file: src/content/settings/form.json
        description: "Where contact form messages are sent."
        fields:
          - { name: action, label: "Form address (form.taxi)", widget: string, hint: "The form.taxi link that receives the messages. Only change this if you create a new form there." }
